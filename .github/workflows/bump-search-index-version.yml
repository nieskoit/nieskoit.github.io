name: Bump search index version

on:
  push:
    branches:
      - pv
    paths:
      - 'public/js/wiki-search-index.js'
      - 'public/js/main.js'
      - 'public/js/catalog-render.js'
      - 'public/js/catalog-sync.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-search-index-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: pv

      - name: Update search index version
        id: version
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("public")
          pattern = re.compile(
              r'(wiki-search-index\.js)(?:\?v=[^"\'\s&]*)?'
          )
          numeric_version = re.compile(
              r'wiki-search-index\.js\?v=(\d+)'
          )

          html_files = [path for root in root if root.exists() for path in root.rglob("*.html")]
          current_versions = []

          for path in html_files:
              content = path.read_text(encoding="utf-8")
              current_versions.extend(
                  int(match.group(1))
                  for match in numeric_version.finditer(content)
              )

          version = max(current_versions, default=0) + 1
          changed = []

          for path in html_files:
              content = path.read_text(encoding="utf-8")
              updated, count = pattern.subn(
                  lambda match: f"{match.group(1)}?v={version}",
                  content
              )

              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"New search index version: {version}")
          print(f"Updated HTML files: {len(changed)}")
          for path in changed:
              print(f"Updated: {path}")

          with open("version.txt", "w", encoding="utf-8") as file:
              file.write(str(version))
          PY

          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          rm version.txt

      - name: Regenerate catalog and search fallback
        run: node tools/generate-catalog.js --generated-only

      - name: Synchronize JavaScript cache versions
        run: node tools/update-asset-versions.js

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u -- public pv/SZABLONY-HTML

          if git diff --cached --quiet; then
            echo "No HTML references needed updating."
          else
            git commit -m "Bump search index version to ${{ steps.version.outputs.version }}"
            git push origin HEAD:pv
          fi
