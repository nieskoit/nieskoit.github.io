name: Fix HTML cache versions

on:
  push:
    branches:
      - pv
    paths:
      - 'public/**/*.html'
      - 'public/**/index.html'
      - '.github/workflows/fix-cache-versions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-cache-versions:
    name: Fix cache versions in public HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure correct branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/pv" ]; then
            echo "This workflow may only modify the pv branch."
            exit 1
          fi

      - name: Update cache versions in all HTML files
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          public = Path("public")
          if not public.is_dir():
              sys.exit("ERROR: public/ directory not found.")

          replacements = [
              (
                  re.compile(r'(/css/main\.css\?v=)[^"\'&\s]+'),
                  r'\g<1>20261024-episode-title-white2',
                  "main.css",
              ),
              (
                  re.compile(r'(/js/wiki-search-index\.js\?v=)[^"\'&\s]+'),
                  r'\g<1>20261023-polish3',
                  "wiki-search-index.js",
              ),
          ]

          totals = {name: 0 for _, _, name in replacements}
          changed_files = 0

          for file in public.rglob("*.html"):
              original = file.read_text(encoding="utf-8")
              updated = original

              for pattern, replacement, name in replacements:
                  updated, count = pattern.subn(replacement, updated)
                  totals[name] += count

              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  changed_files += 1

          print(f"HTML files modified: {changed_files}")
          for name, count in totals.items():
              print(f"{name}: {count} reference(s) updated")

          missing = [name for name, count in totals.items() if count == 0]
          if missing:
              sys.exit("ERROR: No matching references found for: " + ", ".join(missing))
          PY

      - name: Check changes
        run: git diff --check

      - name: Commit fixes
        run: |
          if git diff --quiet -- public; then
            echo "All cache versions are already correct."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public
          git commit -m "fix: synchronize HTML cache versions"
          git push origin HEAD:pv
