
name: Regenerate catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate generated pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pv branch
        uses: actions/checkout@v4
        with:
          ref: pv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate catalog
        run: node tools/generate-catalog.js --generated-only

      - name: Check whitespace
        run: git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- public/odcinki/index.html public/szukaj/index.html

          if git diff --cached --quiet; then
            echo "No relevant generated changes to commit."
            exit 0
          fi

          git commit -m "Regenerate catalog pages"
          git push origin HEAD:pv
